<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AI 기후 탐험대</title>
  <style>
    :root{
      --header-bg:#063e1a;
      --header-fg:#ffffff;
      --page-bg:#f7fff9;
      --card-bg:#ffffff;
      --accent:#2fb64b;
      --danger:#f0625d;
      --muted:#666;
    }
    body{margin:0;font-family:system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;background:var(--page-bg);color:#0b2e10}
    .top-box{background:linear-gradient(90deg,#0b8a3e,#2fb64b);color:white;padding:28px 18px;text-align:center}
    .top-box h1{margin:0;font-size:1.8rem;letter-spacing:1px}

    .layout{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:16px;box-sizing:border-box}

    .left-panel, .right-panel{background:var(--card-bg);border-radius:10px;padding:12px;box-shadow:0 6px 18px rgba(3,30,12,0.06)}

    /* Left: image upload & preview */
    .left-panel{display:flex;flex-direction:column;gap:12px}
    .uploader{display:flex;flex-direction:column;gap:8px}
    #drop-area{border:2px dashed rgba(11,138,62,0.18);border-radius:8px;padding:12px;display:flex;align-items:center;justify-content:center;min-height:220px;background:linear-gradient(180deg,#fff,#f8fff9)}
    #drop-area.dragover{border-color:var(--accent);box-shadow:0 10px 30px rgba(11,138,62,0.06)}
    #preview{display:flex;align-items:center;justify-content:center}
    #preview img{width:25vw;max-width:360px;max-height:320px;border-radius:8px;object-fit:contain}
    .controls{display:flex;gap:8px;align-items:center}
    .controls label, .controls button{background:white;border:1px solid #ddd;padding:8px 10px;border-radius:8px;cursor:pointer}

    /* Right: two stacked boxes */
    .right-panel{display:grid;grid-template-rows:1fr 1fr;gap:12px}
    .box{background:var(--card-bg);border-radius:8px;padding:10px;border:1px solid #eee;overflow:auto}

    /* Confusion matrix */
    table.confusion{border-collapse:collapse;width:100%;text-align:center}
    table.confusion th, table.confusion td{border:1px solid #ddd;padding:6px}
    table.confusion th{background:#fafafa}
    .cell-correct{background:#c8f1bf}
    .cell-wrong{background:#f7bcbc}

    /* Wrong gallery */
    .gallery{display:flex;flex-wrap:wrap;gap:8px}
    .thumb{width:120px;border:1px solid #ddd;border-radius:6px;overflow:hidden;background:#fff;padding:6px;display:flex;flex-direction:column;align-items:center}
    .thumb img{width:100%;height:80px;object-fit:cover;border-radius:4px}
    .thumb .meta{font-size:12px;color:var(--muted);margin-top:6px;text-align:center}

    /* Accuracy */
    .stats{padding:12px;background:var(--card-bg);border-radius:8px;margin:16px;border:1px solid #eee}

    @media(max-width:900px){
      .layout{grid-template-columns:1fr;}
      #preview img{width:40vw}
    }
  </style>
</head>
<body>
  <div class="top-box">
    <h1>AI 기후 탐험대</h1>
  </div>

  <div class="layout">
    <div class="left-panel">
      <div class="uploader">
        <div id="drop-area">
          <div id="preview" class="placeholder">
            <div style="text-align:center">
              <div style="font-weight:700;color:#196f3a">여기에 사진을 끌어다 놓으세요</div>
              <div style="color:var(--muted);margin-top:6px">또는 아래의 찾아보기를 사용하세요</div>
            </div>
          </div>
        </div>
        <div class="controls">
          <input type="file" id="file-input" accept="image/*" style="display:none">
          <label for="file-input">찾아보기</label>
          <select id="truth-select" aria-label="실제 레이블">
            <option value="">(실제 레이블 선택)</option>
          </select>
          <button id="classify">분류하기</button>
        </div>
        <div style="font-size:13px;color:var(--muted)">선택한 이미지가 화면 크기의 약 1/4 크기로 표시됩니다.</div>
      </div>
    </div>

    <div class="right-panel">
      <div class="box" id="confusion-box">
        <h3 style="margin-top:0">혼동행렬</h3>
        <div id="confusion-container">
          <!-- table generated by JS -->
        </div>
      </div>

      <div class="box" id="wrong-box">
        <h3 style="margin-top:0">오답 사진 모음</h3>
        <div class="gallery" id="gallery"></div>
      </div>
    </div>
  </div>

  <div class="stats" id="stats">
    정확도: <strong id="accuracy">-</strong>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
  <script src="./public/main.js"></script>
</body>
</html>
