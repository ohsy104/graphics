<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AI 세계기후탐험대 — 평가 화면</title>
  <style>
    :root{
      --header-bg:#063e1a;
      --header-fg:#ffffff;
      --page-bg:#ffffff;
      --left-card-bg:#eaf7ec;
      --right-card-bg:#eefef6;
      --card-border:#e6e6e6;
      --primary:#0b8a3e;
      --accent:#2fb64b;
      --danger:#f0625d;
    }
    html,body{height:100%;margin:0;font-family:system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;background:var(--page-bg);color:#0b2e10}
    header{background:var(--header-bg);color:var(--header-fg);padding:1rem;text-align:center}
    header h1{margin:0;font-size:1.6rem}
    .container{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:1rem;padding:1rem;height:calc(100vh - 76px);box-sizing:border-box}
    .card{border:1px solid var(--card-border);border-radius:10px;padding:1rem;box-shadow:0 4px 14px rgba(10,10,10,0.04);overflow:auto}
    .left-card{background:var(--left-card-bg)}
    .right-card{background:var(--right-card-bg)}

    #drop-area{width:100%;max-width:420px;height:260px;border:2px dashed rgba(11,138,62,0.18);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(180deg, rgba(255,255,255,0.6), rgba(250,255,245,0.6));transition:all .15s}
    #drop-area.dragover{border-color:var(--primary);background:linear-gradient(180deg, #ffffff, #f7fff6);box-shadow:0 6px 18px rgba(11,138,62,0.06)}
    #drop-area img{max-width:100%;max-height:100%;border-radius:8px}
    #drop-area .hint{color:#196f3a;font-weight:600}
    #drop-area small{color:#6b6b6b}

    #controls{display:flex;gap:0.5rem;align-items:center;margin-top:0.6rem}
    button.primary{background:var(--primary);color:white;border:none;padding:0.6rem 0.9rem;border-radius:8px;cursor:pointer;font-weight:600}
    button.ghost{background:white;border:1px solid #ddd;padding:0.5rem 0.8rem;border-radius:8px;cursor:pointer}
    button:disabled{opacity:0.6;cursor:not-allowed}

    .small-note{font-size:0.88rem;color:#555;margin-top:0.6rem}

    table.confusion{border-collapse:collapse;width:100%;text-align:center}
    table.confusion th, table.confusion td{border:1px solid #ddd;padding:0.5rem}
    table.confusion th{background:#fafafa}
    .cell-correct{background:#c8f1bf}
    .cell-wrong{background:#f7bcbc}

    .bars{display:flex;flex-direction:column;gap:0.6rem}
    .bar-row{display:flex;align-items:center;gap:0.6rem}
    .bar-label{width:120px;font-size:0.95rem}
    .bar-track{flex:1;background:#eee;height:18px;border-radius:9px;overflow:hidden}
    .bar-fill{height:100%;background:linear-gradient(90deg,#88e27a,#2fb64b)}
    .percent{width:48px;text-align:right;font-size:0.95rem}

    .gallery{display:flex;flex-wrap:wrap;gap:0.5rem}
    .thumb{width:96px;height:72px;border:1px solid #ddd;border-radius:6px;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:11px;flex-direction:column;background:#fff;padding:4px}
    .thumb img{max-width:100%;max-height:56px;display:block}

    .error-box{margin-top:0.8rem;padding:0.6rem;border-radius:6px;background:#fff3f3;border:1px solid #f1cfcf}

    footer{padding:0.6rem 1rem;text-align:right;font-size:0.85rem;color:#666}

    @media(max-width:900px){
      .container{grid-template-columns:1fr;grid-template-rows:auto auto auto auto;height:auto}
      #drop-area{max-width:100%}
    }
  </style>
</head>
<body>
  <header>
    <h1>AI 세계기후탐험대</h1>
  </header>

  <div class="container">
    <section class="card left-card" id="left-top">
      <h2>사진 넣기</h2>
      <div id="input-area">
        <div id="drop-area">
          <div class="hint">여기에 사진을 끌어다 놓으세요</div>
          <small>또는 찾아보기로 선택</small>
        </div>
        <div id="controls">
          <input type="file" id="file-input" accept="image/*" style="display:none">
          <button class="ghost" id="browse">찾아보기</button>
          <button class="primary" id="classify" disabled>분류하기</button>
        </div>
        <div class="small-note">사진을 넣고 실제 레이블을 선택한 뒤 분류 버튼을 누르면 결과가 기록됩니다.</div>
        <div style="margin-top:0.6rem">
          <label for="truth-select">실제 레이블: </label>
          <select id="truth-select">
            <option value="0">열대기후</option>
            <option value="1">한대기후</option>
            <option value="2">온대기후</option>
          </select>
        </div>
      </div>
    </section>

    <section class="card right-card" id="right-top">
      <h2>혼동행렬</h2>
      <div id="confusion-container">
        <table class="confusion" id="confusion-table"></table>
      </div>
      <div class="small-note" style="margin-top:0.5rem">정분류 셀은 연두색, 오분류 셀은 붉은색으로 표시됩니다.</div>
    </section>

    <section class="card left-card" id="left-bottom">
      <h2>클래스별 정분류율</h2>
      <div class="bars" id="bars-container"></div>
      <div class="small-note">각 클래스의 정분류율(%)을 보여줍니다.</div>
    </section>

    <section class="card right-card" id="right-bottom">
      <h2>틀린 사진 모음 / 정확도 오류</h2>
      <div id="gallery" class="gallery"></div>
      <div class="error-box" id="error-box">
        <strong>정확도 오류 (정확도 &lt; 75%)</strong>
        <ul id="error-list"></ul>
      </div>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
  <script src="./public/main.js"></script>
  <footer></footer>
</body>
</html>
