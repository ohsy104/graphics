<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 기후 탐험대</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --sky: #dff1f7;
    --ink: #1f3a4d;
    --sand: #f6e7c1;
    --leaf: #2e9e6b;
    --sun: #f2a33a;
    --ice: #5aa9e6;
    --track: #e3e8ec;
    --unsure: #7a6f9b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Noto Sans KR", sans-serif;
    color: var(--ink);
    background: linear-gradient(180deg, var(--sky) 0%, #f4fafc 55%, var(--sand) 100%);
    display: flex;
    justify-content: center;
    padding: 32px 16px 56px;
  }

  /* 왼쪽(기존 화면) + 오른쪽(기후 설명) 2단 배치 */
  .layout {
    width: 100%;
    max-width: 1000px;
    display: grid;
    grid-template-columns: minmax(0, 520px) minmax(0, 420px);
    gap: 32px;
    justify-content: center;
    align-items: start;
  }
  main { width: 100%; text-align: center; }
  aside { position: sticky; top: 32px; }

  h1 {
    font-family: "Jua", "Noto Sans KR", sans-serif;
    font-size: clamp(2rem, 7vw, 2.6rem);
    margin: 0 0 8px;
    letter-spacing: 0.5px;
  }
  .sub { margin: 0 0 24px; line-height: 1.6; color: #44606f; }
  .zones {
    display: flex; justify-content: center; gap: 8px; margin-bottom: 24px; flex-wrap: wrap;
  }
  .zones span {
    padding: 4px 12px; border-radius: 999px; font-size: 0.85rem; font-weight: 700; color: #fff;
  }
  .z-trop { background: var(--sun); }
  .z-temp { background: var(--leaf); }
  .z-cold { background: var(--ice); }

  .upload-btn {
    display: inline-block; cursor: pointer;
    background: var(--ink); color: #fff;
    font-family: inherit; font-size: 1.05rem; font-weight: 700;
    padding: 14px 28px; border: 0; border-radius: 14px;
  }
  .upload-btn:hover { background: #2b5068; }
  .upload-btn:focus-visible { outline: 3px solid var(--sun); outline-offset: 3px; }
  #file { display: none; }

  #status { margin: 20px 0 8px; font-weight: 700; font-size: 1.05rem; }
  #preview {
    display: none; width: 100%; max-width: 380px; max-height: 300px; object-fit: cover;
    margin: 12px auto 8px; border-radius: 16px; box-shadow: 0 6px 20px rgba(31,58,77,.25);
  }
  #result { display: none; text-align: left; max-width: 440px; margin: 16px auto 0; }
  #verdict {
    text-align: center; font-family: "Jua", sans-serif; font-size: 1.5rem; margin-bottom: 14px;
  }
  #verdict.unsure { color: var(--unsure); }
  #verdict small {
    display: block; margin-top: 6px;
    font-family: "Noto Sans KR", sans-serif; font-size: 0.9rem; color: #5d7686;
  }
  .row { margin-bottom: 14px; }
  .label { font-weight: 700; margin-bottom: 4px; }
  .track { background: var(--track); border-radius: 999px; height: 30px; overflow: hidden; }
  .fill {
    height: 100%; min-width: 44px; width: 0; border-radius: 999px;
    color: #fff; font-weight: 700; font-size: 0.9rem;
    display: flex; align-items: center; justify-content: flex-end; padding: 0 10px;
    transition: width .5s ease;
  }
  .row.top .label::after { content: " ⭐"; }

  /* 오른쪽 기후 특징 설명 칸 */
  #climate-info {
    text-align: left;
    padding: 22px 24px 24px;
    border-radius: 18px;
    background: rgba(255, 255, 255, 0.88);
    border-left: 8px solid var(--ink);
    box-shadow: 0 6px 20px rgba(31,58,77,.12);
    line-height: 1.85;
    font-size: 1.05rem;
  }
  #climate-info h3 {
    font-family: "Jua", "Noto Sans KR", sans-serif;
    font-size: 1.5rem;
    font-weight: 400;
    margin: 0 0 10px;
  }
  #climate-info ul { margin: 0; padding-left: 22px; }
  #climate-info li { margin-bottom: 6px; }

  /* 사진을 올리기 전 안내 상태 */
  #climate-info.empty {
    border-left-color: var(--track);
    border: 2px dashed #b9c8d2;
    background: rgba(255, 255, 255, 0.5);
    box-shadow: none;
    text-align: center;
    color: #5d7686;
  }

  /* 화면이 좁으면(태블릿 세로, 스마트폰) 위아래로 쌓기 */
  @media (max-width: 960px) {
    .layout { grid-template-columns: minmax(0, 520px); gap: 20px; }
    aside { position: static; }
    #climate-info.empty { display: none; }
  }

  @media (prefers-reduced-motion: reduce) { .fill { transition: none; } }
</style>
</head>
<body>
<div class="layout">

  <!-- 왼쪽: 기존 화면 -->
  <main>
    <h1>🧭 AI 기후 탐험대</h1>
    <p class="sub">풍경 사진을 올리면 AI가<br>열대·온대·한대 중 어떤 기후인지 판단해 줘요.</p>
    <div class="zones">
      <span class="z-trop">열대기후</span>
      <span class="z-temp">온대기후</span>
      <span class="z-cold">한대기후</span>
    </div>

    <label class="upload-btn" for="file" tabindex="0">📷 사진 업로드하기</label>
    <input type="file" id="file" accept="image/*">

    <div id="status">⏳ 모델을 불러오는 중이에요...</div>
    <img id="preview" alt="업로드한 사진">

    <div id="result">
      <div id="verdict"></div>
      <div id="bars"></div>
    </div>
  </main>

  <!-- 오른쪽: 기후 특징 설명 -->
  <aside>
    <div id="climate-info" class="empty"></div>
  </aside>

</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>
<script>
  // 이 확률(70%)을 넘는 기후가 하나도 없으면 "잘 모르겠어요"라고 답해요.
  // 기준을 바꾸고 싶으면 이 숫자만 고치면 돼요. (0.7 = 70%)
  const THRESHOLD = 0.7;

  // 모델 파일 경로 (저장소 맨 위 models/my-model 폴더)
  // 위에서부터 차례로 시도하고, 앞의 경로가 안 되면 다음 경로를 써요.
  // 마지막은 티처블머신 서버 주소라서 폴더 위치가 틀려도 작동해요.
  const BASES = [
    "./models/my-model/",
    "/models/my-model/",
    "./public/models/my-model/",
    "https://teachablemachine.withgoogle.com/models/4E3fH9sQf/"
  ];
  const COLORS = { "열대기후": "#f2a33a", "온대기후": "#2e9e6b", "한대기후": "#5aa9e6" };

  // 기후별 특징 설명 (글을 바꾸고 싶으면 아래 문장만 고치면 돼요)
  const CLIMATE_INFO = {
    "열대기후": {
      title: "🌴 열대기후의 특징",
      color: "#f2a33a",
      points: [
        "일 년 내내 날씨가 더워요. (평균 기온 18℃ 이상)",
        "비가 아주 많이 와요. 갑자기 쏟아지는 소나기 '스콜'도 있어요.",
        "키가 큰 나무가 빽빽한 열대우림과 야자수, 바나나 나무가 자라요.",
        "더위와 비를 피하려고 지붕이 뾰족하고 바람이 잘 통하는 집을 지어요.",
        "동남아시아, 아마존, 아프리카 가운데 지역에서 볼 수 있어요."
      ]
    },
    "온대기후": {
      title: "🍂 온대기후의 특징",
      color: "#2e9e6b",
      points: [
        "봄·여름·가을·겨울, 사계절이 뚜렷해요.",
        "너무 덥지도 너무 춥지도 않아서 사람이 살기 좋아요.",
        "단풍나무처럼 계절에 따라 잎 색이 변하는 나무가 많아요.",
        "벼, 밀, 과일 농사를 많이 해요.",
        "우리나라, 일본, 유럽, 미국 동부 등에서 볼 수 있어요."
      ]
    },
    "한대기후": {
      title: "❄️ 한대기후의 특징",
      color: "#5aa9e6",
      points: [
        "일 년 내내 아주 추워요. 가장 따뜻한 달도 10℃가 안 돼요.",
        "땅이 꽁꽁 얼어 있어서 큰 나무가 거의 자라지 못해요.",
        "이끼와 키 작은 풀이 자라요.",
        "북극곰, 순록, 펭귄처럼 추위에 강한 동물이 살아요.",
        "북극과 남극 주변, 시베리아 북쪽에서 볼 수 있어요."
      ]
    }
  };

  const statusEl = document.getElementById("status");
  const preview = document.getElementById("preview");
  const result = document.getElementById("result");
  const bars = document.getElementById("bars");
  const verdict = document.getElementById("verdict");
  const infoEl = document.getElementById("climate-info");
  const fileInput = document.getElementById("file");
  let model = null;

  // 사진을 올리기 전(또는 새 사진 분석 중)에 보이는 안내 문구
  function showInfoPlaceholder() {
    infoEl.className = "empty";
    infoEl.style.borderLeftColor = "";
    infoEl.innerHTML =
      "<h3>🔎 기후 특징</h3>" +
      "<p style='margin:0'>사진을 올리면 AI가 판단한<br>기후의 특징이 여기에 나와요.</p>";
  }
  showInfoPlaceholder();

  // AI가 확신하지 못할 때 오른쪽 칸에 보이는 안내 문구
  function showInfoUnsure() {
    infoEl.className = "empty";
    infoEl.style.borderLeftColor = "";
    infoEl.innerHTML =
      "<h3>🤔 아직 잘 모르겠어요</h3>" +
      "<p style='margin:0'>어느 기후도 70%를 넘지 못했어요.<br>" +
      "다른 풍경 사진으로 다시 해 볼까요?</p>";
  }

  async function init() {
    for (const base of BASES) {
      try {
        model = await tmImage.load(base + "model.json", base + "metadata.json");
        console.log("모델 불러오기 성공:", base);
        statusEl.textContent = "✨ 로딩 완료! 사진을 업로드해보세요.";
        return;
      } catch (e) {
        console.warn("모델 불러오기 실패:", base, e);
      }
    }
    statusEl.textContent = "⚠️ 모델을 불러오지 못했어요. 새로고침 해 보세요.";
  }
  init();

  document.querySelector(".upload-btn").addEventListener("keydown", (e) => {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); fileInput.click(); }
  });

  fileInput.addEventListener("change", () => {
    const file = fileInput.files[0];
    if (!file) return;
    if (!model) { statusEl.textContent = "⏳ 모델을 아직 불러오는 중이에요. 잠시 후 다시 해보세요."; return; }
    statusEl.textContent = "🔍 분석 중...";
    result.style.display = "none";
    showInfoPlaceholder();
    preview.onload = predict;
    preview.src = URL.createObjectURL(file);
    preview.style.display = "block";
  });

  async function predict() {
    let preds;
    try {
      preds = await model.predict(preview);
    } catch (e) {
      console.error(e);
      statusEl.textContent = "⚠️ 사진을 분석하지 못했어요. 다른 사진으로 다시 해 보세요.";
      return;
    }

    const best = preds.reduce((a, b) => (b.probability > a.probability ? b : a));
    const confident = best.probability >= THRESHOLD;

    bars.innerHTML = "";
    preds.forEach((p) => {
      const pct = (p.probability * 100).toFixed(1);
      const row = document.createElement("div");
      // 70%를 넘었을 때만 가장 높은 기후에 ⭐ 표시
      row.className = "row" + (confident && p === best ? " top" : "");
      row.innerHTML =
        '<div class="label">' + p.className + '</div>' +
        '<div class="track"><div class="fill" style="background:' +
        (COLORS[p.className] || "#888") + '">' + pct + '%</div></div>';
      bars.appendChild(row);
      requestAnimationFrame(() => {
        row.querySelector(".fill").style.width = Math.max(p.probability * 100, 0) + "%";
      });
    });

    if (!confident) {
      // 세 기후 모두 70% 미만 -> 잘 모르겠어요
      verdict.className = "unsure";
      verdict.innerHTML = "🤔 잘 모르겠어요<small>어느 기후도 70%를 넘지 못했어요.</small>";
      showInfoUnsure();
    } else {
      verdict.className = "";
      verdict.textContent = "이 사진은 「" + best.className + "」 같아요!";

      // 오른쪽 칸에 판단한 기후의 특징 보여주기
      const info = CLIMATE_INFO[best.className];
      if (info) {
        infoEl.className = "";
        infoEl.style.borderLeftColor = info.color;
        infoEl.innerHTML =
          "<h3>" + info.title + "</h3><ul>" +
          info.points.map((t) => "<li>" + t + "</li>").join("") +
          "</ul>";
      } else {
        showInfoPlaceholder();
      }
    }

    statusEl.textContent = "";
    result.style.display = "block";
  }
</script>
</body>
</html>
