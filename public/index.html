<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AI 세계기후탐험대 — 평가 화면</title>
  <style>
    :root{
      --header-bg:#063e1a; /* 더 진한 녹색 */
      --header-fg:#ffffff;
      --page-bg:#ffffff; /* 흰색 배경 */
      --left-card-bg:#eaf7ec; /* 왼쪽 블럭 통일 색 (연한 초록) */
      --right-card-bg:#eefef6; /* 오른쪽 블럭 통일 색 (약간 다른 연두) */
      --panel-bg:#ffffff;
      --accent-green:#b8f2a1;
      --bad-red:#f48b8b;
      --muted:#666;
      --card-border:#e6e6e6;
    }
    html,body{height:100%;margin:0;font-family:system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;background:var(--page-bg);color:#0b2e10}
    header{background:var(--header-bg);color:var(--header-fg);padding:1rem;text-align:center}
    header h1{margin:0;font-size:1.6rem}
    .container{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:1rem;padding:1rem;height:calc(100vh - 76px);box-sizing:border-box}
    .card{border:1px solid var(--card-border);border-radius:8px;padding:1rem;box-shadow:0 1px 2px rgba(0,0,0,0.03);overflow:auto}
    .left-card{background:var(--left-card-bg)}
    .right-card{background:var(--right-card-bg)}
    #input-area{display:flex;flex-direction:column;gap:0.75rem;align-items:flex-start}
    #preview{width:320px;height:220px;border:1px dashed #cfcfcf;border-radius:6px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#fafafa}
    #preview img, #preview canvas{max-width:100%;max-height:100%;display:block}
    #controls{display:flex;gap:0.5rem;flex-wrap:wrap}
    button, select, input[type="file"]{padding:0.4rem 0.6rem;border-radius:6px;border:1px solid #cfcfcf;background:white;cursor:pointer}
    button[disabled]{opacity:0.5;cursor:default}
    table.confusion{border-collapse:collapse;width:100%;text-align:center}
    table.confusion th, table.confusion td{border:1px solid #ddd;padding:0.5rem}
    table.confusion th{background:#fafafa}
    .cell-correct{background:#c8f1bf}
    .cell-wrong{background:#f7bcbc}
    .bars{display:flex;flex-direction:column;gap:0.5rem}
    .bar-row{display:flex;align-items:center;gap:0.5rem}
    .bar-label{width:120px;font-size:0.95rem}
    .bar-track{flex:1;background:#eee;height:18px;border-radius:9px;overflow:hidden}
    .bar-fill{height:100%;background:linear-gradient(90deg,#88e27a,#2fb64b)}
    .percent{width:48px;text-align:right;font-size:0.9rem}
    .gallery{display:flex;flex-wrap:wrap;gap:0.5rem}
    .thumb{width:96px;height:72px;border:1px solid #ddd;border-radius:6px;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:11px;flex-direction:column;background:#fff;padding:4px}
    .thumb img{max-width:100%;max-height:56px;display:block}
    .error-box{margin-top:0.8rem;padding:0.6rem;border-radius:6px;background:#fff3f3;border:1px solid #f1cfcf}
    .small-note{font-size:0.85rem;color:var(--muted)}
    footer{padding:0.5rem 1rem;text-align:right;font-size:0.85rem;color:var(--muted)}
    @media(max-width:900px){
      .container{grid-template-columns:1fr;grid-template-rows:auto auto auto auto;height:auto}
    }
  </style>
</head>
<body>
  <header>
    <h1>AI 세계기후탐험대</h1>
  </header>

  <div class="container">
    <section class="card left-card" id="left-top">
      <h2>사진 입력</h2>
      <div id="input-area">
        <div id="preview">미리보기가 여기에 표시됩니다</div>
        <div id="controls">
          <input type="file" id="file-input" accept="image/*">
          <button id="start-webcam">웹캠 시작</button>
          <button id="capture" disabled>캡처</button>
          <button id="predict-btn" disabled>예측 및 기록</button>
          <select id="truth-select">
            <option value="0">열대기후</option>
            <option value="1">한대기후</option>
            <option value="2">온대기후</option>
          </select>
        </div>
        <div class="small-note">이미지 업로드 또는 웹캠 캡처 후 실제 레이블을 선택하고 "예측 및 기록"을 눌러 주세요.</div>
      </div>
    </section>

    <section class="card right-card" id="right-top">
      <h2>혼동행렬 (Confusion Matrix)</h2>
      <div id="confusion-container">
        <table class="confusion" id="confusion-table"></table>
      </div>
      <div class="small-note" style="margin-top:0.5rem">정분류 셀은 연두색, 오분류 셀은 붉은색입니다.</div>
    </section>

    <section class="card left-card" id="left-bottom">
      <h2>클래스별 정분류율</h2>
      <div class="bars" id="bars-container"></div>
      <div class="small-note" style="margin-top:0.5rem">각 클래스의 정분류율(%)을 보여줍니다.</div>
    </section>

    <section class="card right-card" id="right-bottom">
      <h2>틀린 사진 모음 / 정확도 오류</h2>
      <div id="gallery" class="gallery"></div>
      <div class="error-box" id="error-box">
        <strong>정확도 오류 (정확도 &lt; 75%)</strong>
        <ul id="error-list"></ul>
      </div>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
  <script src="./public/main.js"></script>
  <footer></footer>
</body>
</html>
