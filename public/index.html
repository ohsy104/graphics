<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>사진 업로드 데모</title>
  <style>
    :root{
      --header-bg:#063e1a;
      --page-bg:#f7fff9;
      --card-bg:#ffffff;
      --accent:#2fb64b;
      --muted:#666;
    }
    body{margin:0;font-family:system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;background:var(--page-bg);color:#0b2e10}
    .top-box{background:linear-gradient(90deg,#0b8a3e,#2fb64b);color:white;padding:24px 18px;text-align:center}
    .top-box h1{margin:0;font-size:1.6rem}

    .layout{display:grid;grid-template-columns:1fr;gap:16px;padding:16px;box-sizing:border-box;max-width:1100px;margin:18px auto}
    .card{background:var(--card-bg);border-radius:12px;padding:18px;box-shadow:0 6px 18px rgba(3,30,12,0.06)}

    #drop-area{border:2px dashed rgba(11,138,62,0.18);border-radius:10px;padding:18px;display:flex;align-items:center;justify-content:center;min-height:320px;background:linear-gradient(180deg,#fff,#fbfffb)}
    #drop-area.dragover{border-color:var(--accent);box-shadow:0 8px 22px rgba(11,138,62,0.06)}
    #preview{display:flex;align-items:center;justify-content:center;width:100%;height:100%}
    #preview img{max-width:100%;max-height:520px;border-radius:8px;object-fit:contain;display:block}

    .controls{display:flex;gap:8px;align-items:center;margin-top:12px}
    .controls label, .controls button{background:white;border:1px solid #ddd;padding:8px 12px;border-radius:8px;cursor:pointer}

    .meta{font-size:13px;color:var(--muted);margin-top:10px}

    @media(max-width:900px){
      #drop-area{min-height:220px}
      #preview img{max-height:360px}
    }
  </style>
</head>
<body>
  <div class="top-box">
    <h1>사진 업로드 데모</h1>
  </div>

  <div class="layout">
    <div class="card">
      <div id="drop-area">
        <div id="preview" class="placeholder">
          <div style="text-align:center">
            <div style="font-weight:700;color:#196f3a">여기에 사진을 끌어다 놓으세요</div>
            <div style="color:var(--muted);margin-top:6px">또는 아래의 찾아보기를 사용하세요</div>
          </div>
        </div>
      </div>

      <div class="controls">
        <input type="file" id="file-input" accept="image/*" style="display:none">
        <label for="file-input" id="browse" style="display:inline-block; cursor:pointer; user-select:none;">찾아보기</label>
        <div id="filename" style="color:var(--muted)"></div>
      </div>

      <div class="meta">업로드된 사진은 로컬에서 미리보기만 됩니다. (모델/웹캠 제거된 모드)</div>
    </div>
  </div>

  <script src="./main.js"></script>
</body>
</html>
